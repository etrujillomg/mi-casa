<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Casa Madridejos</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap');
:root{
  --bg:#FAF7F2;--bg2:#F2ECE3;--bg3:#E8DFD0;
  --white:#FFFFFF;--ink:#1A1814;--ink2:#4A4540;--muted:#9A9088;
  --border:#DDD5C8;--border2:#C8BFB0;
  --sage:#4A7C59;--sage-l:#EAF2EC;--sage-d:#2D5C3A;
  --clay:#B5654A;--clay-l:#FAF0EB;
  --si-bg:#F0FDF4;--si:#16a34a;
  --duda-bg:#FFFBEB;--duda:#D97706;
  --no-bg:#FEF2F2;--no:#DC2626;
  --r:12px;--rsm:8px;--rcard:14px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

#login{min-height:100vh;display:flex;flex-direction:column;background:var(--bg2)}
.login-hero{padding:3rem 1.5rem 2rem;text-align:center;background:var(--bg2);border-bottom:1px solid var(--border)}
.app-name{font-family:'Lora',serif;font-size:32px;font-weight:500;color:var(--ink);letter-spacing:-.02em;margin-bottom:5px}
.app-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.login-deco{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:20px;height:52px}
.deco-sq{border-radius:6px;background:var(--bg3);border:1px solid var(--border)}
.login-form{padding:1.5rem 1.25rem;flex:1}
.form-q{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:14px}
.chip{padding:6px 14px;border:1.5px solid var(--border2);border-radius:20px;font-size:.82rem;cursor:pointer;background:var(--white);color:var(--ink2);font-family:'Inter',sans-serif;transition:all .15s;font-weight:500}
.chip:hover{border-color:var(--sage);color:var(--sage)}
.chip.sel{color:white;border-color:transparent;font-weight:600}
.or-line{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:0 0 12px}
.or-line::before,.or-line::after{content:'';flex:1;height:.5px;background:var(--border)}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--rsm);font-size:.88rem;background:var(--white);color:var(--ink);outline:none;font-family:'Inter',sans-serif}
.name-row input:focus{border-color:var(--sage)}
.btn-enter{padding:10px 18px;background:var(--sage);color:white;border:none;border-radius:var(--rsm);font-size:.88rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}

#main{display:none}
.wrap{max-width:680px;margin:0 auto}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(26,24,20,.06)}
.topbar-left .tn{font-family:'Lora',serif;font-size:1.05rem;color:var(--ink);font-weight:500}
.topbar-left .ts{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.user-pill{display:flex;align-items:center;gap:7px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:white;flex-shrink:0}
.av-name{font-size:.8rem;color:var(--ink2);font-weight:500}

.plano-section{padding:12px 14px;border-bottom:1px solid var(--border)}
.plano-lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:9px}
.plano-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.plano-wrap svg{width:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .15s}
.hs:hover{transform:translate(-50%,-50%) scale(1.1)}
.hsb{width:32px;height:32px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);animation:pulse 2.5s ease infinite}
.hsb.active{animation:none;box-shadow:0 0 0 4px rgba(74,124,89,.3)}
.hsl{background:rgba(26,24,20,.8);color:white;font-size:9px;font-weight:500;padding:2px 6px;border-radius:4px;white-space:nowrap}
.plano-hint{font-size:.72rem;color:var(--muted);text-align:center;margin-top:7px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,124,89,.3)}50%{box-shadow:0 0 0 6px rgba(74,124,89,0)}}

.tabs{display:flex;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--border);scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;border:none;background:none;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--sage);border-bottom-color:var(--sage)}

#content{padding-bottom:130px}
.section{padding:14px 16px;border-bottom:1px solid var(--border)}
.sec-lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:11px}

.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.foto-sq{aspect-ratio:1/1;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--bg3);position:relative}
.foto-sq img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.foto-sq:hover img{transform:scale(1.05)}
.foto-sq .f-del{position:absolute;top:4px;right:4px;background:rgba(26,24,20,.65);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center}
.foto-sq:hover .f-del{display:flex}
.foto-sq .f-who{position:absolute;bottom:4px;left:5px;background:rgba(26,24,20,.6);color:white;font-size:8px;padding:1px 5px;border-radius:4px}
.upload-foto{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:6px;border:1.5px dashed var(--border2);background:var(--white);cursor:pointer;flex-direction:column;gap:3px;color:var(--muted);font-size:11px;transition:all .15s}
.upload-foto:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-l)}
.upload-foto input{display:none}

.estado-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;position:relative}
.estado-edit-btn{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:4px}
.estado-edit-btn:hover{background:var(--bg2);color:var(--ink)}
.estado-text{font-size:.88rem;color:var(--ink2);line-height:1.55;padding-right:28px}
.estado-textarea{width:100%;font-size:.88rem;border:1.5px solid var(--sage);border-radius:var(--rsm);padding:8px 10px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--white);outline:none;resize:none;min-height:70px}
.estado-save{margin-top:7px;padding:7px 16px;background:var(--sage);color:white;border:none;border-radius:var(--rsm);font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif}
.plan-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 13px;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}

.inv-item{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.inv-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none}
.inv-em{font-size:1.1rem;flex-shrink:0}
.inv-nm{font-size:.88rem;font-weight:500;flex:1;color:var(--ink)}
.inv-del{background:none;border:none;cursor:pointer;font-size:12px;color:var(--muted);padding:3px 6px;border-radius:4px;transition:all .15s;flex-shrink:0}
.inv-del:hover{color:var(--no);background:var(--no-bg)}
.tag{font-size:.72rem;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tag-si{background:var(--si-bg);color:var(--si)}
.tag-duda{background:var(--duda-bg);color:var(--duda)}
.tag-no{background:var(--no-bg);color:var(--no)}
.tag-comprar{background:#EFF6FF;color:#2563EB}
.inv-bd{display:none;padding:0 13px 12px;border-top:1px solid var(--bg3)}
.inv-bd.open{display:block}
.inv-desc{font-size:.8rem;color:var(--muted);padding:8px 0 10px;line-height:1.45}
.inv-votes{display:flex;gap:7px;margin-bottom:10px}
.vbtn{display:flex;align-items:center;gap:4px;padding:6px 13px;border:1px solid var(--border2);border-radius:20px;background:none;cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;color:var(--ink2);transition:all .15s}
.vbtn:hover{background:var(--sage-l);border-color:var(--sage);color:var(--sage)}
.vbtn.vsi{background:var(--si-bg);border-color:var(--si);color:var(--si)}
.vbtn.vno{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.inv-cms{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.icm{font-size:.8rem;padding:7px 10px;border-radius:var(--rsm);line-height:1.45;display:flex;gap:8px;align-items:flex-start;background:var(--bg)}
.icm-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:white;flex-shrink:0;margin-top:1px}
.icm-txt b{font-weight:600;margin-right:4px;font-size:.8rem}
.icm-txt span{color:var(--ink2)}
.iadd{display:flex;gap:6px}
.iadd input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-size:.8rem;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;outline:none}
.iadd input:focus{border-color:var(--sage)}
.iadd button{padding:7px 12px;background:var(--sage);color:white;border:none;border-radius:var(--rsm);font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif}

.inv-foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}
.inv-foto-sq{aspect-ratio:1/1;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--bg3);position:relative}
.inv-foto-sq img{width:100%;height:100%;object-fit:cover;display:block}
.inv-foto-sq .f-del{position:absolute;top:3px;right:3px;background:rgba(26,24,20,.65);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center}
.inv-foto-sq:hover .f-del{display:flex}
.inv-upload-foto{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:6px;border:1.5px dashed var(--border2);background:var(--white);cursor:pointer;flex-direction:column;gap:2px;color:var(--muted);font-size:10px;transition:all .15s}
.inv-upload-foto:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-l)}
.inv-upload-foto input{display:none}

.add-inv-form{background:var(--white);border:1.5px dashed var(--border2);border-radius:var(--r);padding:13px;margin-top:8px}
.add-inv-form input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--rsm);font-size:.88rem;background:var(--bg);font-family:'Inter',sans-serif;outline:none;color:var(--ink);margin-bottom:9px}
.add-inv-form input:focus{border-color:var(--sage)}
.status-btns{display:flex;gap:6px;margin-bottom:10px}
.stbtn{flex:1;padding:7px 4px;border:1.5px solid var(--border2);border-radius:20px;font-size:.75rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;background:var(--white);color:var(--ink2);text-align:center;transition:all .15s}
.stbtn.sel-si{background:var(--si-bg);border-color:var(--si);color:var(--si)}
.stbtn.sel-duda{background:var(--duda-bg);border-color:var(--duda);color:var(--duda)}
.stbtn.sel-no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.stbtn.sel-comprar{background:#EFF6FF;border-color:#2563EB;color:#2563EB}
.add-inv-form button.go{width:100%;padding:10px;background:var(--ink);color:white;border:none;border-radius:var(--rsm);font-size:.88rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

.nota-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--clay)}
.nota-card.reply{border-left-color:var(--sage)}
.nota-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.nota-reply-to{font-size:11px;color:var(--muted);margin-bottom:6px;padding:4px 8px;background:var(--bg2);border-radius:4px;border-left:2px solid var(--border2)}
.nota-text{font-size:.88rem;color:var(--ink2);line-height:1.55;margin-bottom:8px}
.nota-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--rsm);display:block;margin-bottom:8px;cursor:pointer}
.nota-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nota-reply-btn{background:none;border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.nota-reply-btn:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-l)}
.nota-del-btn{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:4px;margin-left:auto}
.nota-del-btn:hover{color:var(--no);background:var(--no-bg)}
.add-decision-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--border2);border-radius:20px;background:none;cursor:pointer;font-size:.72rem;color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s}
.add-decision-btn:hover{border-color:var(--clay);color:var(--clay);background:var(--clay-l)}

.nota-form{background:var(--white);border:1.5px solid var(--sage);border-radius:var(--r);padding:12px;margin-bottom:8px}
.nota-form .reply-banner{font-size:11px;color:var(--sage);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.nota-form .reply-banner button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px}
.nota-form textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-size:.88rem;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);outline:none;resize:none;height:68px}
.nota-form textarea:focus{border-color:var(--sage)}
.nota-foto-upload{display:block;border:1.5px dashed var(--border2);border-radius:var(--rsm);padding:10px;text-align:center;cursor:pointer;color:var(--muted);font-size:.8rem;background:var(--bg);transition:all .15s;margin-top:8px}
.nota-foto-upload:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-l)}
.nota-foto-upload input{display:none}
.nota-form-actions{display:flex;gap:7px;margin-top:8px}
.nota-submit{padding:7px 16px;background:var(--sage);color:white;border:none;border-radius:var(--rsm);font-size:.82rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.nota-cancel{padding:7px 12px;background:var(--bg2);color:var(--ink2);border:none;border-radius:var(--rsm);font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif}
.add-nota-btn{width:100%;padding:10px;border:1.5px dashed var(--border2);border-radius:var(--r);background:var(--white);cursor:pointer;font-size:.85rem;color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s;text-align:center;margin-top:4px}
.add-nota-btn:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-l)}

.post-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rcard);overflow:hidden;margin-bottom:10px}
.post-header{display:flex;align-items:center;gap:9px;padding:11px 13px 8px}
.post-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:white;flex-shrink:0}
.post-meta{flex:1}
.post-name{font-size:.88rem;font-weight:600;color:var(--ink)}
.post-time{font-size:.72rem;color:var(--muted)}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}
.post-body{padding:11px 13px}
.post-text{font-size:.88rem;color:var(--ink2);line-height:1.55;margin-bottom:9px}
.post-link{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sage-l);border-radius:var(--rsm);margin-bottom:9px;text-decoration:none;border:1px solid rgba(74,124,89,.2)}
.post-link-icon{font-size:15px;flex-shrink:0}
.post-link-info{flex:1;min-width:0}
.post-link-name{font-size:.82rem;font-weight:600;color:var(--sage-d)}
.post-link-url{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-link-price{font-size:.8rem;font-weight:700;color:var(--sage);white-space:nowrap}
.post-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post-prod-tag{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg2);border-radius:var(--rsm);margin-bottom:9px;border:1px solid var(--border)}
.post-prod-name{font-size:.82rem;font-weight:600;color:var(--ink2);flex:1}
.post-prod-price{font-size:.82rem;font-weight:700;color:var(--sage);white-space:nowrap}
.post-menu{margin-left:auto;display:flex;gap:5px}
.post-menu-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:var(--rsm);font-family:'Inter',sans-serif;transition:all .15s}
.post-menu-btn:hover{background:var(--bg2);color:var(--ink)}
.post-menu-btn.del:hover{background:var(--no-bg);color:var(--no)}
.post-edit-area{padding:10px 13px;border-top:1px solid var(--bg3)}
.post-edit-area textarea{width:100%;padding:8px 10px;border:1.5px solid var(--sage);border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:.88rem;color:var(--ink);background:var(--white);outline:none;resize:none;height:72px}
.post-edit-area .edit-actions{display:flex;gap:7px;margin-top:7px}
.post-edit-save{background:var(--sage);color:white;padding:6px 14px;border:none;border-radius:var(--rsm);font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.post-edit-cancel{background:var(--bg2);color:var(--ink2);padding:6px 14px;border:none;border-radius:var(--rsm);font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif}
.like-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:none;cursor:pointer;font-size:.78rem;color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s}
.like-btn:hover,.like-btn.liked{background:var(--clay-l);border-color:var(--clay);color:var(--clay)}

.decision-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.decision-card-header{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
.decision-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dot-comprado{background:#16a34a}
.dot-pendiente{background:#d97706}
.dot-decidir{background:#9A9088}
.decision-body{flex:1}
.decision-title{font-size:.88rem;font-weight:500;color:var(--ink);margin-bottom:3px}
.decision-origin{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.decision-tags{display:flex;gap:6px;flex-wrap:wrap}
.dtag{font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:500;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s}
.dtag-comprado{background:#f0fdf4;color:#16a34a}
.dtag-comprado.active{background:#16a34a;color:white}
.dtag-pendiente{background:#fffbeb;color:#d97706}
.dtag-pendiente.active{background:#d97706;color:white}
.dtag-decidir{background:var(--bg2);color:var(--muted)}
.dtag-decidir.active{background:var(--muted);color:white}
.decision-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:4px;flex-shrink:0}
.decision-del:hover{color:var(--no);background:var(--no-bg)}

function pc(n){ return (PERSONAS[n]||{color:'#888'}).color; }
function ini(n){ return (n||'?').slice(0,2).toUpperCase(); }
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = (Date.now()-d.getTime())/1000;
  if(s<60) return 'ahora mismo';
  if(s<3600) return 'hace '+Math.floor(s/60)+' min';
  if(s<86400) return 'hace '+Math.floor(s/3600)+' h';
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}
function compressImg(file, maxPx){
  maxPx = maxPx||900;
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxPx/Math.max(img.width,img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*scale);
        c.height = Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function vote(itemId, tipo, e){
  e.stopPropagation();
  if(!votes[itemId]) votes[itemId]={si:[],no:[]};
  var otro = tipo==='si'?'no':'si';
  votes[itemId][otro] = (votes[itemId][otro]||[]).filter(function(x){return x!==me;});
  var idx = (votes[itemId][tipo]||[]).indexOf(me);
  if(idx===-1){ votes[itemId][tipo]=votes[itemId][tipo]||[]; votes[itemId][tipo].push(me); }
  else votes[itemId][tipo].splice(idx,1);
  db.collection('inv_votes').doc(currentRoom+'_'+itemId).set({room:currentRoom,itemId:itemId,votes:votes[itemId]},{merge:true}).catch(function(){});
  var allItems = (INV_BASE[currentRoom]||[]).concat(invExtra[currentRoom]||[]);
  var item = allItems.filter(function(x){return x.id===itemId;})[0];
  if(item){
    var el=document.getElementById('inv-'+itemId);
    var wasOpen = document.getElementById('ibd-'+itemId) && document.getElementById('ibd-'+itemId).classList.contains('open');

    }).join('');

    db.collection('fotos_casa').where('room','==',currentRoom).get().then(function(snap){
      var fotos=snap.docs.map(function(d){return {id:d.id,dataUrl:d.data().dataUrl,author:d.data().author};});
      var items=fotos.map(function(f){
        return '<div class="foto-sq" onclick="openLightboxEl(this)"><img src="'+f.dataUrl+'" alt="foto" loading="lazy"><button class="f-del" onclick="event.stopPropagation();delFotoEspacio(\''+f.id+'\')">x</button><span class="f-who">'+(f.author||'').split(' ')[0]+'</span></div>';
      }).join('');
      grid.innerHTML=items+'<label class="upload-foto"><span style="font-size:20px">+</span><span>Foto</span><input type="file" accept="image/*" multiple onchange="uploadFotoEspacio(this)"></label>';

function delFotoEspacio(id){

}

function loadNotas(){
  db.collection('notas_ideas').where('room','==',currentRoom).orderBy('ts','asc').get().then(function(snap){
    notasData[currentRoom]=snap.docs.map(function(d){return {id:d.id,author:d.data().author,text:d.data().text,foto:d.data().foto,replyTo:d.data().replyTo,ts:d.data().ts};});
    renderNotas();
  }).catch(function(){
    db.collection('notas_ideas').where('room','==',currentRoom).get().then(function(snap){
      notasData[currentRoom]=snap.docs.map(function(d){return {id:d.id,author:d.data().author,text:d.data().text,foto:d.data().foto,replyTo:d.data().replyTo,ts:d.data().ts};}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
      renderNotas();
    }).catch(function(){ notasData[currentRoom]=[]; renderNotas(); });
  });
}

function renderNotas(){
  var el=document.getElementById('notas-section'); if(!el) return;
  var notas=notasData[currentRoom]||[];
  var room=ROOMS.filter(function(r){return r.id===currentRoom;})[0];
  var notasHtml=notas.map(function(n){
    var isAuthor=n.author===me;
    var replyHtml=n.replyTo?'<div class="nota-reply-to">Resp. a '+n.replyTo.author+': "'+((n.replyTo.text||'').slice(0,60))+'"</div>':'';
    var delBtn=isAuthor?'<button class="nota-del-btn" onclick="deleteNota(\''+n.id+'\')">&#x1F5D1;</button>':'';
    var imgHtml=n.foto?'<img class="nota-img" src="'+n.foto+'" alt="imagen" onclick="openLightboxEl(this)">':'';
    var txtHtml=n.text?'<div class="nota-text">'+n.text+'</div>':'';
    return '<div class="nota-card'+(n.replyTo?' reply':'')+'" id="nota-'+n.id+'">'
      +'<div class="nota-head"><div class="av" style="background:'+pc(n.author)+';width:24px;height:24px;font-size:9px;flex-shrink:0">'+ini(n.author)+'</div>'
      +'<span style="font-size:12px;font-weight:600;color:var(--ink)">'+n.author+'</span>'
      +'<span style="font-size:11px;color:var(--muted);margin-left:4px">'+(n.ts?timeAgo({toDate:function(){return new Date(n.ts);}}):'ahora')+'</span></div>'
      +replyHtml+imgHtml+txtHtml
      +'<div class="nota-actions">'
      +'<button class="nota-reply-btn" onclick="startReply(\''+n.id+'\',\''+n.author+'\',\''+(n.text||'').slice(0,60).replace(/'/g,'')+'\')" >Responder</button>'
      +'<button class="add-decision-btn" onclick="addDecisionFrom(\''+n.id+'\',\'nota\')">Anadir a decisiones</button>'
      +delBtn
      +'</div>'
      +'</div>';
  }).join('');
  el.innerHTML=(room.idea?'<div class="idea-box" style="margin-bottom:10px"><p>'+room.idea+'</p></div>':'')
    +notasHtml
    +'<div id="nota-form-wrap"></div>'
    +'<button class="add-nota-btn" onclick="showNotaForm()">Escribir una nota o idea</button>';
}

function showNotaForm(replyTo){
  notaReplyTo=replyTo||null;
  var wrap=document.getElementById('nota-form-wrap'); if(!wrap) return;
  var replyBanner=replyTo?'<div class="reply-banner"><span>Respondiendo a '+replyTo.author+'</span><button onclick="cancelNota()">x</button></div>':'';
  wrap.innerHTML='<div class="nota-form">'
    +replyBanner
    +'<textarea id="nota-txt" placeholder="'+(replyTo?'Escribe tu respuesta...':'Escribe tu nota o idea...')+'"></textarea>'
    +'<label class="nota-foto-upload"><span id="nota-foto-lbl-txt">Subir imagen (IA, inspiracion, render...)</span>'
    +'<input type="file" id="nota-foto-input" accept="image/*" onchange="pickNotaFoto(this)"></label>'
    +'<img id="nota-foto-preview" style="display:none;width:100%;max-height:120px;object-fit:cover;border-radius:var(--rsm);margin-top:6px">'
    +'<div class="nota-form-actions">'
    +'<button class="nota-submit" onclick="submitNota()">Publicar</button>'
    +'<button class="nota-cancel" onclick="cancelNota()">Cancelar</button>'
    +'</div></div>';
  var ta=document.getElementById('nota-txt'); if(ta) ta.focus();
  var btn=document.querySelector('.add-nota-btn'); if(btn) btn.style.display='none';
}

function startReply(id, author, text){ showNotaForm({id:id,author:author,text:text}); }

function cancelNota(){
  var wrap=document.getElementById('nota-form-wrap'); if(wrap) wrap.innerHTML='';
  var btn=document.querySelector('.add-nota-btn'); if(btn) btn.style.display='';
  notaReplyTo=null; notaFotoData=null;
}

function pickNotaFoto(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    notaFotoData=e.target.result;
    var prev=document.getElementById('nota-foto-preview'); if(prev){prev.src=notaFotoData;prev.style.display='block';}
    var lbl=document.getElementById('nota-foto-lbl-txt'); if(lbl) lbl.textContent='Imagen lista';
  };
  reader.readAsDataURL(file);
}

function submitNota(){
  var ta=document.getElementById('nota-txt');
  var text=ta?ta.value.trim():null;
  if(!text&&!notaFotoData){toast('Escribe algo o anade una imagen');return;}
  var doSave=function(fotoCompressed){
    var nota={room:currentRoom,author:me,text:text||null,foto:fotoCompressed||null,ts:Date.now(),replyTo:notaReplyTo||null};
    db.collection('notas_ideas').add(Object.assign({},nota,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})).then(function(ref){
      nota.id=ref.id;
      if(!notasData[currentRoom]) notasData[currentRoom]=[];
      notasData[currentRoom].push(nota);
      notaReplyTo=null; notaFotoData=null;
      renderNotas(); toast('Nota publicada');
    }).catch(function(){ toast('Error al publicar'); });
  };
  if(notaFotoData){
    var file=document.getElementById('nota-foto-input'); file=file?file.files[0]:null;
    if(file){ compressImg(file,900).then(doSave).catch(function(){doSave(notaFotoData);}); }
    else doSave(notaFotoData);
  } else doSave(null);
}

function deleteNota(id){
  if(!confirm('Borrar esta nota?')) return;
  db.collection('notas_ideas').doc(id).delete().catch(function(){});
  notasData[currentRoom]=(notasData[currentRoom]||[]).filter(function(x){return x.id!==id;});
  renderNotas(); toast('Nota eliminada');
}

function loadDecisiones(){
  db.collection('decisiones').where('room','==',currentRoom).orderBy('ts','asc').get().then(function(snap){
    decisiones[currentRoom]=snap.docs.map(function(d){return {id:d.id,text:d.data().text,origin:d.data().origin,author:d.data().author,status:d.data().status,ts:d.data().ts};});
    renderDecisiones();
  }).catch(function(){
    db.collection('decisiones').where('room','==',currentRoom).get().then(function(snap){
      decisiones[currentRoom]=snap.docs.map(function(d){return {id:d.id,text:d.data().text,origin:d.data().origin,author:d.data().author,status:d.data().status,ts:d.data().ts};}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
      renderDecisiones();
    }).catch(function(){decisiones[currentRoom]=[]; renderDecisiones();});
  });
}

function renderDecisiones(){
  var el=document.getElementById('decisiones-section'); if(!el) return;
  var items=decisiones[currentRoom]||[];
  if(!items.length){el.innerHTML='<div class="empty-decisions">Aun no hay decisiones - anade una desde una nota o publicacion</div>';return;}
  el.innerHTML=items.map(function(d){
    var dot=d.status==='comprado'?'comprado':d.status==='pendiente'?'pendiente':'decidir';
    return '<div class="decision-card" id="dec-'+d.id+'">'
      +'<div class="decision-card-header">'
      +'<div class="decision-status-dot dot-'+dot+'"></div>'
      +'<div class="decision-body">'
      +'<div class="decision-title">'+d.text+'</div>'
      +'<div class="decision-origin">Anadido por '+d.author+(d.origin?' - desde '+d.origin:'')+'</div>'
      +'<div class="decision-tags">'
      +'<button class="dtag dtag-comprado'+(d.status==='comprado'?' active':'')+'" onclick="setDecisionStatus(\''+d.id+'\',\'comprado\')">Comprado</button>'
      +'<button class="dtag dtag-pendiente'+(d.status==='pendiente'?' active':'')+'" onclick="setDecisionStatus(\''+d.id+'\',\'pendiente\')">Pendiente de comprar</button>'
      +'<button class="dtag dtag-decidir'+(d.status==='decidir'?' active':'')+'" onclick="setDecisionStatus(\''+d.id+'\',\'decidir\')">Por decidir</button>'
      +'</div></div>'
      +'<button class="decision-del" onclick="deleteDecision(\''+d.id+'\')">x</button>'
      +'</div></div>';
  }).join('');
}

function addDecision(text, origin){
  var item={room:currentRoom,text:(text||'').slice(0,200),origin:origin||'',author:me,status:'decidir',ts:Date.now()};
  db.collection('decisiones').add(Object.assign({},item,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})).then(function(ref){
    item.id=ref.id;
    if(!decisiones[currentRoom]) decisiones[currentRoom]=[];
    decisiones[currentRoom].push(item);
    renderDecisiones(); toast('Anadido a decisiones');
  }).catch(function(){ toast('Error al guardar'); });
}

function addDecisionFrom(id, origin){
  var text='';
  if(origin==='nota'){
    var el=document.getElementById('nota-'+id);
    if(el){ var t=el.querySelector('.nota-text'); text=t?t.textContent:''; }
  } else {
    var el2=document.getElementById('pcard-'+id);
    if(el2){ var t2=el2.querySelector('.post-text'); text=t2?t2.textContent:(el2.querySelector('.post-link-name')?el2.querySelector('.post-link-name').textContent:'Publicacion'); }
  }
  addDecision(text.slice(0,200), origin);
}

function setDecisionStatus(id, status){
  db.collection('decisiones').doc(id).update({status:status}).catch(function(){});
  var d=(decisiones[currentRoom]||[]).filter(function(x){return x.id===id;})[0];
  if(d){d.status=status; renderDecisiones();}
}

function deleteDecision(id){
  if(!confirm('Borrar esta decision?')) return;
  db.collection('decisiones').doc(id).delete().catch(function(){});
  decisiones[currentRoom]=(decisiones[currentRoom]||[]).filter(function(x){return x.id!==id;});
  renderDecisiones(); toast('Eliminado');
}

function subscribePosts(){
  unsub=db.collection('posts').where('room','==',currentRoom).orderBy('createdAt','desc').onSnapshot(function(snap){
    renderPosts(snap.docs.map(function(d){return {id:d.id,author:d.data().author,createdAt:d.data().createdAt,text:d.data().text,fotoData:d.data().fotoData,linkUrl:d.data().linkUrl,prod:d.data().prod,likedBy:d.data().likedBy};}));
  },function(){
    db.collection('posts').where('room','==',currentRoom).get().then(function(snap){
      var posts=snap.docs.map(function(d){return {id:d.id,author:d.data().author,createdAt:d.data().createdAt,text:d.data().text,fotoData:d.data().fotoData,linkUrl:d.data().linkUrl,prod:d.data().prod,likedBy:d.data().likedBy};}).sort(function(a,b){var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;return tb-ta;});
      renderPosts(posts);
    }).catch(function(){var el=document.getElementById('posts-list');if(el)el.innerHTML='<div class="empty">Error al cargar</div>';});
  });
}

function renderPosts(posts){
  var el=document.getElementById('posts-list'); if(!el) return;
  if(!posts.length){el.innerHTML='<div class="empty">Anade el primer link o referencia</div>';return;}
  el.innerHTML=posts.map(function(p){
    var liked=(p.likedBy||[]).indexOf(me)>=0;
    var lc=(p.likedBy||[]).length;
    var isAuthor=p.author===me;
    var ownerHtml=isAuthor?'<div class="post-menu"><button class="post-menu-btn" onclick="editPost(\''+p.id+'\')">Editar</button><button class="post-menu-btn del" onclick="deletePost(\''+p.id+'\')">Borrar</button></div>':'';
    var imgHtml=p.fotoData?'<img class="post-img" src="'+p.fotoData+'" alt="foto" onclick="openLightboxEl(this)">':'';
    var txtHtml=p.text?'<div class="post-text">'+p.text+'</div>':'';
    var linkHtml='';
    var prodName='', prodPrice='';
    if(p.prod){
      var parts=p.prod.split('·');
      prodName=parts[0].trim();
      prodPrice=parts.length>1?parts[1].trim():'';
    }
    if(p.linkUrl){
      var domain=p.linkUrl.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
      linkHtml='<a class="post-link" href="'+p.linkUrl+'" target="_blank" rel="noopener">'
        +'<span class="post-link-icon">&#x1F517;</span>'
        +'<div class="post-link-info">'
        +'<div class="post-link-name">'+(prodName||domain)+'</div>'
        +'<div class="post-link-url">'+domain+'</div>'
        +'</div>'
        +(prodPrice?'<span class="post-link-price">'+prodPrice+'</span>':'')
        +'</a>';
    } else if(p.prod){
      linkHtml='<div class="post-prod-tag">'
        +'<span class="post-prod-name">'+prodName+'</span>'
        +(prodPrice?'<span class="post-prod-price">'+prodPrice+'</span>':'')
        +'</div>';
    }
    return '<div class="post-card" id="pcard-'+p.id+'" style="border-left:3px solid '+pc(p.author)+'">'
      +'<div class="post-header"><div class="post-av" style="background:'+pc(p.author)+'">'+ini(p.author)+'</div>'
      +'<div class="post-meta"><div class="post-name">'+p.author+'</div><div class="post-time">'+timeAgo(p.createdAt)+'</div></div></div>'
      +imgHtml
      +'<div class="post-body">'
      +'<div id="ptxt-'+p.id+'">'+txtHtml+'</div>'
      +linkHtml
      +'<div class="post-actions">'
      +'<button class="like-btn '+(liked?'liked':'')+'" onclick="likePost(\''+p.id+'\','+liked+')">&#x2665; '+(lc||'')+'</button>'
      +'<button class="add-decision-btn" onclick="addDecisionFrom(\''+p.id+'\',\'publicacion\')">Anadir a decisiones</button>'
      +ownerHtml
      +'</div>'
      +'<div class="post-edit-area" id="pedit-'+p.id+'" style="display:none">'
      +'<textarea id="petxt-'+p.id+'">'+(p.text||'')+'</textarea>'
      +'<div class="edit-actions"><button class="post-edit-save" onclick="saveEditPost(\''+p.id+'\')">Guardar</button><button class="post-edit-cancel" onclick="cancelEditPost(\''+p.id+'\')">Cancelar</button></div>'
      +'</div>'
      +'</div></div>';
  }).join('');
}

function likePost(id, liked){
  db.collection('posts').doc(id).update({likedBy:liked?firebase.firestore.FieldValue.arrayRemove(me):firebase.firestore.FieldValue.arrayUnion(me)}).catch(function(){});
}
function editPost(id){
  var ea=document.getElementById('pedit-'+id); if(ea) ea.style.display='block';
  var ta=document.getElementById('petxt-'+id); if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}
function cancelEditPost(id){ var ea=document.getElementById('pedit-'+id); if(ea) ea.style.display='none'; }
function saveEditPost(id){
  var ta=document.getElementById('petxt-'+id); var text=ta?ta.value.trim():null;
  db.collection('posts').doc(id).update({text:text||null}).then(function(){
    cancelEditPost(id); toast('Publicacion actualizada');
  }).catch(function(){ toast('Error al guardar'); });
}
function deletePost(id){
  if(!confirm('Borrar esta publicacion?')) return;
  db.collection('posts').doc(id).delete().then(function(){
    var el=document.getElementById('pcard-'+id); if(el) el.remove(); toast('Publicacion eliminada');
  }).catch(function(){ toast('Error al borrar'); });
}

function renderRoom(){
  var room=ROOMS.filter(function(r){return r.id===currentRoom;})[0];
  var el=document.getElementById('content');
  var est=estados[currentRoom]||room.estado;
  var pla=planos[currentRoom]||room.plano;
  var allInv=(INV_BASE[currentRoom]||[]).concat(invExtra[currentRoom]||[]);

  el.innerHTML='<div class="section"><div class="sec-lbl">Fotos del espacio</div>'
    +'<div class="fotos-grid" id="fotos-grid"><div class="empty" style="grid-column:1/-1;padding:14px">Cargando...</div></div>'
    +'</div>'
    +'<div class="section"><div class="sec-lbl">Estado actual</div>'
    +'<div class="estado-card" id="ecard-'+currentRoom+'">'
    +'<p class="estado-text">'+est+'</p>'
    +'<button class="estado-edit-btn" onclick="editEstado(\''+currentRoom+'\')">&#x270F;</button>'
    +'</div>'
    +'<div class="plan-card"><div id="plano-txt-'+currentRoom+'" style="display:flex;align-items:center;gap:6px;flex:1">'
    +'<span>&#x1F4D0; '+pla+'</span>'
    +'<button onclick="editPlano(\''+currentRoom+'\')" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 4px">&#x270F;</button>'
    +'</div></div>'
    +'</div>'
    +'<div class="section"><div class="sec-lbl">Inventario - que se queda?</div>'
    +'<div id="inv-items">'+allInv.map(renderInvItem).join('')+'</div>'
    +'<div class="add-inv-form">'
    +'<input type="text" id="ex-input" placeholder="Nombre del objeto...">'
    +'<div class="status-btns">'
    +'<button class="stbtn" id="nst-si" onclick="setNewSt(\'si\')">Se queda</button>'
    +'<button class="stbtn sel-duda" id="nst-duda" onclick="setNewSt(\'duda\')">En duda</button>'
    +'<button class="stbtn" id="nst-no" onclick="setNewSt(\'no\')">Fuera</button>'
    +'<button class="stbtn" id="nst-comprar" onclick="setNewSt(\'comprar\')">Por comprar</button>'
    +'</div>'
    +'<button class="go" onclick="addExtra()">Anadir al inventario</button>'
    +'</div></div>'
    +'<div class="section"><div class="sec-lbl">Notas e ideas</div>'
    +'<div id="notas-section"><div class="empty" style="padding:16px">Cargando...</div></div>'
    +'</div>'
    +'<div class="section"><div class="sec-lbl">Links y referencias</div>'
    +'<button class="section-pub-btn" onclick="openFormFromSection()">+ Anadir link, foto o referencia</button>'
    +'<div id="posts-list"><div class="empty">Cargando...</div></div>'
    +'</div>'
    +'<div class="section"><div class="sec-lbl">Decisiones</div>'
    +'<div id="decisiones-section"><div class="empty-decisions">Cargando...</div></div>'
    +'</div>';

  loadFotosGrid();
  loadNotas();
  loadDecisiones();
  db.collection('room_data').doc(currentRoom).get().then(function(rdoc){
    if(rdoc.exists){
      var d=rdoc.data();
      if(d.estado){estados[currentRoom]=d.estado; var ec=document.getElementById('ecard-'+currentRoom); if(ec) ec.innerHTML='<p class="estado-text">'+d.estado+'</p><button class="estado-edit-btn" onclick="editEstado(\''+currentRoom+'\')">&#x270F;</button>';}
      if(d.plano){planos[currentRoom]=d.plano; var pt=document.getElementById('plano-txt-'+currentRoom); if(pt) pt.innerHTML='<span>&#x1F4D0; '+d.plano+'</span><button onclick="editPlano(\''+currentRoom+'\')" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 4px">&#x270F;</button>';}
    }
  }).catch(function(){});
  db.collection('inv_votes').where('room','==',currentRoom).get().then(function(snap){
    snap.docs.forEach(function(d){var data=d.data(); if(data.itemId) votes[data.itemId]=data.votes||{si:[],no:[]};});
    db.collection('inv_comments').where('room','==',currentRoom).get().then(function(snap2){
      snap2.docs.forEach(function(d){var data=d.data(); if(!invComments[data.itemId]) invComments[data.itemId]=[]; invComments[data.itemId].push({author:data.author,text:data.text});});
      db.collection('inv_extra').where('room','==',currentRoom).get().then(function(snap3){
        invExtra[currentRoom]=snap3.docs.map(function(d){return d.data().item;});
        var allInv2=(INV_BASE[currentRoom]||[]).concat(invExtra[currentRoom]||[]);
        var container=document.getElementById('inv-items');
        if(container) container.innerHTML=allInv2.map(renderInvItem).join('');
        allInv2.forEach(function(item){ loadInvFotos(item.id); });
      }).catch(function(){});
    }).catch(function(){});
  }).catch(function(){});
  newSt='duda';
}

function openFormFromSection(){
  if(!formOpen) toggleForm();
  setTimeout(function(){var el=document.getElementById('fbody'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},100);
}
function toggleForm(){
  formOpen=!formOpen;
  document.getElementById('fbody').classList.toggle('open',formOpen);
  document.getElementById('ficon').classList.toggle('open',formOpen);
}
function pickFoto(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    fotoData=e.target.result;
    var p=document.getElementById('f-preview'); p.src=fotoData; p.style.display='block';
    document.getElementById('upload-lbl').textContent='Foto lista';
  };
  reader.readAsDataURL(file);
}
function publishPost(){
  var text=document.getElementById('f-text').value.trim();
  var link=document.getElementById('f-link').value.trim();
  var prod=document.getElementById('f-prod').value.trim();
  if(!text&&!link&&!fotoData&&!prod){toast('Anade algo antes de publicar');return;}
  var btn=document.getElementById('pub-btn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Publicando...';
  var doPublish=function(compressed){
    db.collection('posts').add({room:currentRoom,author:me,createdAt:firebase.firestore.FieldValue.serverTimestamp(),text:text||null,fotoData:compressed||null,linkUrl:link||null,prod:prod||null,likedBy:[]}).then(function(){
      document.getElementById('f-text').value=''; document.getElementById('f-link').value=''; document.getElementById('f-prod').value='';
      document.getElementById('f-file').value=''; document.getElementById('f-preview').style.display='none';
      document.getElementById('upload-lbl').textContent='Subir foto de inspiracion o del espacio';
      fotoData=null; toggleForm(); toast('Publicado!');
    }).catch(function(e){ console.error(e); toast('Error al publicar'); })
    .finally(function(){btn.disabled=false;btn.innerHTML='Publicar';});
  };
  if(fotoData){
    var file=document.getElementById('f-file').files[0];
    if(file){ compressImg(file,900).then(doPublish).catch(function(){doPublish(fotoData);}); }
    else doPublish(fotoData);
  } else doPublish(null);
}

function openLightboxEl(el){
  var src = el._src || (el.tagName==='IMG' ? el.src : el.querySelector('img').src);
  openLightbox(src);
}
function openLightbox(src){ document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }

initChips();
</script>
</body>
</html>
